name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_VERSION: "3.5.0"
  ALERTMANAGER_VERSION: "0.28.1"
  POSTGRES_EXPORTER_VERSION: "0.17.1"

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dbr_target
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dbr_target"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DBR_TEST_ADMIN_DSN: postgresql://postgres:ci-only@localhost:5432/dbr_target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Tests with coverage (on PostgreSQL)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Runbooks validate
        run: dbremedy runbooks

  evaluation:
    name: Incident scenarios (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dbr_target
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dbr_target"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DBR_ADMIN_DSN: postgresql://postgres:ci-only@localhost:5432/dbr_target
      DBR_APP_DSN: postgresql://dbr_app:dbr-app-local@localhost:5432/dbr_target
      DBR_TARGET_OBSERVER_DSN: postgresql://dbr_observer:dbr-observer-local@localhost:5432/dbr_target
      DBR_TARGET_OPERATOR_DSN: postgresql://dbr_operator:dbr-operator-local@localhost:5432/dbr_target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Create the agent's roles and the demo schema
        run: dbremedy setup
      - name: Rule planner and misbehaving planner, every scenario, zero audit violations
        run: >-
          dbremedy eval --planner rule,rogue --check --report eval-report.md --json eval-results.json
          --reports-dir eval-incident-reports
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-postgres-${{ matrix.postgres }}
          path: |
            eval-report.md
            eval-results.json
            eval-incident-reports

  alerting:
    name: Prometheus → Alertmanager → agent, end to end
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dbr_target
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dbr_target"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DBR_ADMIN_DSN: postgresql://postgres:ci-only@localhost:5432/dbr_target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Install Prometheus, Alertmanager and postgres_exporter
        run: |
          mkdir -p "$HOME/bin"
          get() { curl -fsSL "$1" | tar xz -C /tmp; }
          get "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          get "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          get "https://github.com/prometheus-community/postgres_exporter/releases/download/v${POSTGRES_EXPORTER_VERSION}/postgres_exporter-${POSTGRES_EXPORTER_VERSION}.linux-amd64.tar.gz"
          cp /tmp/prometheus-*/prometheus /tmp/prometheus-*/promtool /tmp/alertmanager-*/alertmanager \
             /tmp/alertmanager-*/amtool /tmp/postgres_exporter-*/postgres_exporter "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Alert rules are valid and their unit tests pass
        run: |
          promtool check rules deploy/prometheus/alerts.yml deploy/e2e/alerts-fast.yml
          (cd deploy/prometheus && promtool test rules alerts.test.yml)
          printf 'x' > /tmp/token && sed 's#/etc/alertmanager/webhook-token#/tmp/token#' \
            deploy/alertmanager/alertmanager.yml > /tmp/am.yml && amtool check-config /tmp/am.yml
      - name: A real lock incident goes through the whole pipeline and is fixed
        run: mkdir -p e2e-logs && E2E_LOGS=e2e-logs ./scripts/e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs
          path: e2e-logs

  image:
    name: Container image builds and runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t db-incident-remediation-agents:ci .
      - name: Runbooks load inside the image, as a non-root user
        run: |
          docker run --rm db-incident-remediation-agents:ci dbremedy runbooks
          test "$(docker run --rm db-incident-remediation-agents:ci id -u)" = "10001"
      - name: Compose file is valid
        run: docker compose config --quiet

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit --skip-editable
