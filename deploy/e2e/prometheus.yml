# End-to-end test configuration: the same pipeline as production, with second-scale timings.
global:
  scrape_interval: 1s
  evaluation_interval: 1s
rule_files: [alerts-fast.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["127.0.0.1:9093"]}]
scrape_configs:
  - job_name: postgres
    static_configs: [{targets: ["127.0.0.1:9187"], labels: {instance: e2e-primary}}]
