# promtool test rules deploy/prometheus/alerts.test.yml
rule_files: [alerts.yml]
evaluation_interval: 15s
tests:
  - name: blocked sessions alert only after a minute of real waits
    interval: 15s
    input_series:
      - series: 'dbr_sessions_blocked{instance="db1"}'
        values: '0 0 3 3 3 3 3 3'
      - series: 'dbr_sessions_longest_lock_wait_seconds{instance="db1"}'
        values: '0 0 40 55 70 85 100 115'
    alert_rule_test:
      - {eval_time: 30s, alertname: PostgresBlockedSessions, exp_alerts: []}
      - eval_time: 90s
        alertname: PostgresBlockedSessions
        exp_alerts:
          - exp_labels: {severity: critical, team: dba, instance: db1}
            exp_annotations: {summary: "3 session(s) blocked on locks on db1", runbook: lock-contention}
  - name: short lock waits do not alert
    interval: 15s
    input_series:
      - series: 'dbr_sessions_blocked{instance="db1"}'
        values: '2x10'
      - series: 'dbr_sessions_longest_lock_wait_seconds{instance="db1"}'
        values: '5x10'
    alert_rule_test:
      - {eval_time: 150s, alertname: PostgresBlockedSessions, exp_alerts: []}
  - name: connection saturation
    interval: 15s
    input_series:
      - series: 'dbr_sessions_client_connections{instance="db1"}'
        values: '50 90 90 90 90 90 90 90 90 90 90'
      - series: 'dbr_sessions_usable_connections{instance="db1"}'
        values: '97x10'
    alert_rule_test:
      - {eval_time: 60s, alertname: PostgresConnectionSaturation, exp_alerts: []}
      - eval_time: 150s
        alertname: PostgresConnectionSaturation
        exp_alerts:
          - exp_labels: {severity: critical, team: dba, instance: db1}
            exp_annotations: {summary: "Connections at 92.78% of the limit on db1", runbook: connection-saturation}
  - name: table bloat needs both a count and a ratio
    interval: 1m
    input_series:
      - series: 'dbr_table_dead_tuples{instance="db1",schemaname="shop",relname="events"}'
        values: '20000x12'
      - series: 'dbr_table_live_tuples{instance="db1",schemaname="shop",relname="events"}'
        values: '20000x12'
      - series: 'dbr_table_dead_tuples{instance="db1",schemaname="shop",relname="huge"}'
        values: '20000x12'
      - series: 'dbr_table_live_tuples{instance="db1",schemaname="shop",relname="huge"}'
        values: '10000000x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: PostgresTableBloat
        exp_alerts:
          - exp_labels: {severity: warning, team: dba, instance: db1, schemaname: shop, relname: events}
            exp_annotations: {summary: "shop.events has 20000 dead tuples", runbook: table-bloat}
  - name: runaway and idle transactions
    interval: 30s
    input_series:
      - series: 'dbr_sessions_longest_query_seconds{instance="db1"}'
        values: '310 340 370 400 430'
      - series: 'dbr_sessions_longest_idle_in_transaction_seconds{instance="db1"}'
        values: '100 130 160 190 220'
    alert_rule_test:
      - eval_time: 90s
        alertname: PostgresLongRunningQuery
        exp_alerts:
          - exp_labels: {severity: warning, team: dba, instance: db1}
            exp_annotations: {summary: "A statement has run for 6m 40s on db1", runbook: runaway-query}
      - {eval_time: 90s, alertname: PostgresIdleInTransaction, exp_alerts: []}
