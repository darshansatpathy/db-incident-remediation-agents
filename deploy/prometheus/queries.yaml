# Custom queries for postgres_exporter (--extend.query-path). The exporter connects as the
# same read-only dbr_observer role the agent uses. Every query reads pg_stat_* views only and
# takes no table locks, so it keeps working during the incidents it reports.
dbr_sessions:
  query: |
    SELECT
      count(*) FILTER (WHERE wait_event_type = 'Lock' AND cardinality(pg_blocking_pids(pid)) > 0) AS blocked,
      coalesce(max(extract(epoch FROM now() - state_change))
        FILTER (WHERE wait_event_type = 'Lock' AND cardinality(pg_blocking_pids(pid)) > 0), 0) AS longest_lock_wait_seconds,
      coalesce(max(extract(epoch FROM now() - query_start))
        FILTER (WHERE state = 'active' AND wait_event_type IS DISTINCT FROM 'Lock'
                AND backend_type = 'client backend' AND usename NOT IN ('dbr_observer', 'dbr_operator')), 0)
        AS longest_query_seconds,
      coalesce(max(extract(epoch FROM now() - state_change))
        FILTER (WHERE state IN ('idle in transaction', 'idle in transaction (aborted)')), 0)
        AS longest_idle_in_transaction_seconds,
      count(*) FILTER (WHERE backend_type = 'client backend') AS client_connections,
      current_setting('max_connections')::float8 - current_setting('superuser_reserved_connections')::float8
        AS usable_connections
    FROM pg_stat_activity
    WHERE pid <> pg_backend_pid()
  metrics:
    - blocked: {usage: GAUGE, description: "Sessions waiting on a lock held by another session"}
    - longest_lock_wait_seconds: {usage: GAUGE, description: "Longest current lock wait"}
    - longest_query_seconds: {usage: GAUGE, description: "Longest running statement not waiting on a lock"}
    - longest_idle_in_transaction_seconds: {usage: GAUGE, description: "Longest idle open transaction"}
    - client_connections: {usage: GAUGE, description: "Client connections"}
    - usable_connections: {usage: GAUGE, description: "max_connections minus superuser_reserved_connections"}

dbr_table:
  query: |
    SELECT schemaname, relname, n_dead_tup::float8 AS dead_tuples, n_live_tup::float8 AS live_tuples
    FROM pg_stat_user_tables
    WHERE n_dead_tup > 1000
  metrics:
    - schemaname: {usage: LABEL, description: "Schema"}
    - relname: {usage: LABEL, description: "Table"}
    - dead_tuples: {usage: GAUGE, description: "Dead tuples"}
    - live_tuples: {usage: GAUGE, description: "Live tuples"}
