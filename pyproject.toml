[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "db-incident-remediation-agents"
version = "0.1.2"
description = "Agents that triage and remediate PostgreSQL incidents from runbooks: Prometheus alerts in, governed actions with approvals, verification and a postmortem out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["postgresql", "incident-response", "aiops", "sre", "agents", "langgraph", "prometheus", "runbooks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pip-audit>=2.7",
]

[project.scripts]
dbremedy = "dbremedy.cli:main"

[project.urls]
Repository = "https://github.com/darshansatpathy/db-incident-remediation-agents"

[tool.hatch.build.targets.wheel]
packages = ["src/dbremedy"]

[tool.hatch.build.targets.wheel.force-include]
"runbooks" = "dbremedy/runbooks"
"policies" = "dbremedy/policies"
"evals" = "dbremedy/evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["dbremedy"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dbremedy"]
mypy_path = "src"
